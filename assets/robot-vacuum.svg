    <ellipse cx="304" cy="430" rx="160" ry="22" fill="#020B16" opacity=".47" filter="url(#blur)"/>
    
    <g filter="url(#shadow)"><g transform="rotate(-9 300 258)"><ellipse cx="300" cy="300" rx="171" ry="130" fill="url(#metal)"/><ellipse cx="300" cy="286" rx="160" ry="117" fill="#273A52"/><ellipse cx="300" cy="281" rx="143" ry="99" fill="#111E33" stroke="#617D9A" stroke-width="3"/><circle cx="300" cy="260" r="35" fill="#344B66" stroke="#AABACD" stroke-width="6"/><circle cx="300" cy="260" r="15" fill="#A4FF6F"/><path d="M235 326q64 37 133 0" fill="none" stroke="#AFD8F5" stroke-width="6" stroke-linecap="round"/></g></g>
