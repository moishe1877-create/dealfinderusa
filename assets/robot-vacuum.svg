    <rect width="600" height="520" fill="url(#bg)"/>
    <rect width="600" height="520" fill="url(#dots)"/>
    <ellipse cx="304" cy="240" rx="246" ry="236" fill="url(#halo)"/>
    <circle cx="493" cy="91" r="104" fill="none" stroke="#8ED2F5" stroke-opacity=".12" stroke-width="1"/>
