<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" role="img" aria-label="Stylized product illustration">
    <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#253047"/><stop offset="1" stop-color="#1A2541"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#81BFFB" stop-opacity=".27"/><stop offset="1" stop-color="#81BFFB" stop-opacity="0"/></radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F5F8FF"/><stop offset=".35" stop-color="#9BABBE"/><stop offset=".7" stop-color="#334A66"/><stop offset="1" stop-color="#E3EDFF"/></linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3C4E69"/><stop offset=".48" stop-color="#152139"/><stop offset="1" stop-color="#080F20"/></linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E7FFAA"/><stop offset="1" stop-color="#A5EC49"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9BD6FF"/><stop offset="1" stop-color="#626BFF"/></linearGradient>
